<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#183c36">
    <title>Meyve Oyunu 2026</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="preload" href="assets/fonts/Baloo2.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/results.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/loading.css">
    <script defer src="lib/phaser.min.js"></script>
    <script type="module" src="src/game.js"></script>
</head>
<body>
<main>
    <section class="game-shell" aria-label="Meyve Bahçesi oyunu">
        <div class="game-toolbar"><span id="toolbar-status" class="sr-only">Karakterini seç</span><span
            class="build-version">Demo · yerel</span>
            <button id="music-menu-button" class="music-toggle" data-music-toggle type="button" aria-label="Müziği kapat" aria-pressed="true">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 23V8L26 5V20M12 12L26 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><ellipse cx="8" cy="24" rx="5" ry="4" fill="currentColor"/><ellipse cx="22" cy="21" rx="5" ry="4" fill="currentColor"/><path class="music-slash" d="M5 4L28 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            </button>
            <button id="settings-button" type="button" aria-label="Oyun menüsünü aç" aria-expanded="false"
                    aria-controls="settings-panel" hidden><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="5" width="6" height="22" rx="2" fill="currentColor"/><rect x="19" y="5" width="6" height="22" rx="2" fill="currentColor"/></svg>
            </button>
            <div id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-label="Oyun menüsü" hidden>
                <div class="settings-card">
                <button id="settings-close" type="button" aria-label="Menüyü kapat"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7L25 25M25 7L7 25" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg></button>
                <div class="pause-actions">
                    <button class="music-toggle" data-music-toggle type="button" aria-label="Müziği kapat" aria-pressed="true">
                        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 23V8L26 5V20M12 12L26 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><ellipse cx="8" cy="24" rx="5" ry="4" fill="currentColor"/><ellipse cx="22" cy="21" rx="5" ry="4" fill="currentColor"/><path class="music-slash" d="M5 4L28 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
                    </button>
                    <button id="menu-button" type="button" aria-label="Bölüm seçimine dön" hidden>
                        <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><rect x="8" y="8" width="18" height="18" rx="5"/><rect x="38" y="8" width="18" height="18" rx="5"/><rect x="8" y="38" width="18" height="18" rx="5"/><rect x="38" y="38" width="18" height="18" rx="5"/></g></svg>
                    </button>
                    <button id="pause-button" type="button" aria-label="Devam et" hidden disabled>
                        <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M19 10 Q17 8 17 14 V50 Q17 56 23 53 L51 36 Q57 32 51 28 L23 11 Q21 10 19 10Z"/></svg>
                    </button>
                </div>
                </div>
            </div>
        </div>
        <div id="game-stage" class="game-stage choosing">
            <div id="game" role="img"
                 aria-label="Çocuk karakterle oynanan, klavyeyle kontrol edilen platform oyunu"></div>
            <section id="welcome-screen" class="welcome-screen" aria-labelledby="welcome-title">
                <h1 id="welcome-title"><span class="welcome-word">MEYVE</span> <span class="welcome-word">BAHÇESİ</span></h1>
                <img class="welcome-child welcome-boy" src="assets/images/hero/child-0.svg" alt="" width="64" height="80">
                <button id="welcome-play" type="button" aria-label="Bölümleri aç" disabled><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 13L50 32L22 51Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg></button>
                <img class="welcome-child welcome-girl" src="assets/images/hero/girl-0.svg" alt="" width="64" height="80">
            </section>
            <section id="character-select" class="character-select" aria-labelledby="character-title" hidden>
                <form id="character-form" class="character-form">
                    <header class="world-heading">
                        <h2 id="character-title" tabindex="-1"><span id="world-number">1.</span><span id="world-name">Meyve Rüyası</span></h2>
                    </header>
                    <div class="world-map">
                        <button id="previous-world" class="world-arrow" type="button" aria-label="Önceki dünya"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M25 8L13 20L25 32"/></svg></button>
                        <fieldset class="level-options">
                            <legend class="sr-only">Bölüm seç</legend>
                            <div class="level-viewport">
                                <div id="level-grid" class="level-grid"></div>
                            </div>
                        </fieldset>
                        <button id="next-world" class="world-arrow" type="button" aria-label="Sonraki dünya"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M15 8L27 20L15 32"/></svg></button>
                    </div>
                    <footer class="menu-footer">
                        <fieldset class="character-options">
                            <legend class="sr-only">Oynayacağın karakter</legend>
                            <label class="character-option"><input type="radio" name="character" value="boy" required checked>
                                <span class="character-card"><span class="character-portrait"><img src="assets/images/hero/child-0.svg" alt="" width="64" height="80"></span><span class="sr-only">Erkek çocuk</span></span>
                            </label>
                            <label class="character-option"><input type="radio" name="character" value="girl" required>
                                <span class="character-card"><span class="character-portrait"><img src="assets/images/hero/girl-0.svg" alt="" width="64" height="80"></span><span class="sr-only">Kız çocuk</span></span>
                            </label>
                        </fieldset>
                        <div id="world-tabs" class="world-tabs" role="group" aria-label="Dünya seç"></div>
                    </footer>
                </form>
            </section>
            <section id="fall-result" class="result" role="dialog" aria-modal="true" aria-labelledby="fall-title" hidden>
                <div class="result-card">
                    <h2 id="fall-title" hidden>Tekrar deneyelim</h2>
                    <button id="retry-fall" type="button" aria-label="Tekrar oyna"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M49 25A20 20 0 1 0 51 41M49 25V10M49 25H34" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                </div>
            </section>
            <section id="game-result" class="result" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
                <div class="result-card">
                    <h2 id="result-title" hidden>Bölüm tamam!</h2>
                    <blockquote id="result-verse" class="result-verse"></blockquote>
                    <button id="next-level" type="button" aria-label="Devam"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 13L50 32L22 51Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg></button>
                    <button id="play-again" type="button" aria-label="Devam" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 13L50 32L22 51Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg></button>
                </div>
            </section>
        </div>
        <section id="game-loading" class="game-loading" role="status" aria-live="polite">
            <div class="loading-card">
                <img src="assets/icons/icon-192.png" width="96" height="96" alt="">
                <p>Yükleniyor…</p>
                <progress id="loading-progress" max="1" aria-label="Oyun yükleniyor"></progress>
            </div>
        </section>
        <div id="touch-controls" class="touch-controls" aria-label="Hareket düğmeleri" hidden>
            <div class="direction-buttons">
                <button id="move-left" class="touch-button" type="button" aria-label="Sola yürü">
                    <svg preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true">
                        <path d="M75 8 C87 1 95 8 95 22 V78 C95 94 87 99 75 92 L17 65 C2 57 2 43 17 35 Z"/>
                    </svg>
                </button>
                <button id="move-right" class="touch-button" type="button" aria-label="Sağa yürü">
                    <svg preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true">
                        <path d="M25 8 C13 1 5 8 5 22 V78 C5 94 13 99 25 92 L83 65 C98 57 98 43 83 35 Z"/>
                    </svg>
                </button>
            </div>
            <button id="jump" class="touch-button jump-button" type="button" aria-label="Zıpla">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="50" r="47"/>
                </svg>
            </button>
        </div>
    </section>


    <audio id="background-music" preload="none" loop hidden></audio>
    <p id="game-status" class="sr-only" role="status" aria-live="polite"></p>
</main>
</body>
</html>
