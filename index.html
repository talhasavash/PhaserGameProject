<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#183c36">
    <title>Meyve Oyunu 2026</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/results.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/loading.css">
    <script defer src="lib/phaser.min.js"></script>
    <script type="module" src="src/game.js"></script>
</head>
<body>
<main>
    <section class="game-shell" aria-label="Meyve Bahçesi oyunu">
        <div class="game-toolbar"><span id="toolbar-status" class="sr-only">Karakterini seç</span><span
            class="build-version">Demo · yerel</span>
            <button id="settings-button" type="button" aria-label="Oyun menüsünü aç" aria-expanded="false"
                    aria-controls="settings-panel" hidden>Ⅱ
            </button>
            <div id="settings-panel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
                <div class="settings-card">
                <button id="settings-close" type="button" aria-label="Menüyü kapat">×</button>
                <h2 id="settings-title">Ayarlar</h2>
                <button id="pause-button" type="button" aria-label="Devam et" hidden disabled>Devam et</button>
                <button id="menu-button" type="button" aria-label="Bölüm seçimine dön" hidden>Ana ekran</button>
                </div>
            </div>
        </div>
        <div id="game-stage" class="game-stage choosing">
            <div id="game" role="img"
                 aria-label="Çocuk karakterle oynanan, klavyeyle kontrol edilen platform oyunu"></div>
            <section id="character-select" class="character-select" aria-labelledby="character-title">
                <form id="character-form" class="character-form">
                    <h2 id="character-title" tabindex="-1"><span aria-hidden="true">✦</span> MEYVE BAHÇESİ</h2>
                    <div class="selection-layout">
                        <fieldset class="character-options">
                            <legend class="sr-only">Oynayacağın karakter</legend>
                            <label class="character-option"><input type="radio" name="character" value="boy"
                                                                   required><span class="character-card"><span
                                class="character-portrait"><img src="assets/images/child-0.svg"
                                                                alt="Sırt çantalı erkek çocuk" width="96" height="120"></span><strong>Erkek çocuk</strong><span
                                class="character-check" aria-hidden="true">✓</span></span></label>
                            <label class="character-option"><input type="radio" name="character" value="girl"
                                                                   required><span class="character-card"><span
                                class="character-portrait"><img src="assets/images/girl-0.svg"
                                                                alt="Başörtülü, sırt çantalı kız çocuk" width="96"
                                                                height="120"></span><strong>Kız çocuk</strong><span
                                class="character-check" aria-hidden="true">✓</span></span></label>
                        </fieldset>
                        <fieldset class="level-options">
                            <legend class="sr-only">Dünya ve bölüm seç</legend>
                            <div id="world-tabs" class="world-tabs" role="group" aria-label="Dünya seç"></div>
                            <div id="level-grid" class="level-grid"></div>
                            </fieldset>
                    </div>
                    <button id="start-button" type="submit" disabled><span aria-hidden="true">▶</span> OYNA</button>
                </form>
            </section>
            <section id="fall-result" class="result" aria-labelledby="fall-title" hidden>
                <div class="result-card">
                    <h2 id="fall-title">Tekrar deneyelim</h2>
                    <button id="retry-fall" type="button">Tekrar oyna</button>
                </div>
            </section>
            <section id="game-result" class="result" aria-labelledby="result-title" hidden>
                <div class="result-card">
                    <h2 id="result-title">Bölüm tamam!</h2>
                    <blockquote id="result-verse" class="result-verse"></blockquote>
                    <button id="next-level" type="button">Devam et</button>
                    <button id="play-again" type="button" hidden>Ana ekran</button>
                </div>
            </section>
        </div>
        <section id="game-loading" class="game-loading" role="status" aria-live="polite" hidden>
            <div class="loading-card">
                <img src="assets/icons/icon-192.png" width="96" height="96" alt="">
                <p>Yükleniyor…</p>
                <progress id="loading-progress" max="1" value="0" aria-label="Bölüm yükleniyor"></progress>
            </div>
        </section>
        <div id="touch-controls" class="touch-controls" aria-label="Hareket düğmeleri" hidden>
            <div class="direction-buttons">
                <button id="move-left" class="touch-button" type="button" aria-label="Sola yürü">
                    <svg preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true">
                        <path d="M75 8 C87 1 95 8 95 22 V78 C95 94 87 99 75 92 L17 65 C2 57 2 43 17 35 Z"/>
                    </svg>
                </button>
                <button id="move-right" class="touch-button" type="button" aria-label="Sağa yürü">
                    <svg preserveAspectRatio="none" viewBox="0 0 100 100" aria-hidden="true">
                        <path d="M25 8 C13 1 5 8 5 22 V78 C5 94 13 99 25 92 L83 65 C98 57 98 43 83 35 Z"/>
                    </svg>
                </button>
            </div>
            <button id="jump" class="touch-button jump-button" type="button" aria-label="Zıpla">
                <svg viewBox="0 0 100 100" aria-hidden="true">
                    <circle cx="50" cy="50" r="44"/>
                </svg>
            </button>
        </div>
    </section>


    <p id="game-status" class="sr-only" role="status" aria-live="polite"></p>
</main>
</body>
</html>
