<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#183c36">
    <title>Meyve Oyunu 2026</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="lib/phaser.min.js"></script>
    <script type="module" src="src/game.js"></script>
</head>
<body>
    <main>
        <section class="game-shell" aria-label="Meyve Bahçesi oyunu">
            <div class="game-toolbar"><span id="toolbar-status" class="sr-only">Karakterini seç</span><div class="toolbar-actions"><button id="pause-button" type="button" disabled>Duraklat</button><button id="restart-button" type="button" disabled>Yeniden başla</button><button id="fullscreen-button" type="button">Tam ekran</button></div></div>
            <div id="game-stage" class="game-stage choosing">
                <div id="game" role="img" aria-label="Çocuk karakterle oynanan, klavyeyle kontrol edilen platform oyunu"></div>
                <section id="character-select" class="character-select" aria-labelledby="character-title">
                    <form id="character-form" class="character-form">
                        <p class="eyebrow">MEYVE BAHÇESİ</p>
                        <h2 id="character-title">Karakterini seç<span>.</span></h2>
                        <p class="character-subtitle">Kiminle keşfe çıkmak istersin?</p>
                        <fieldset class="character-options">
                            <legend class="sr-only">Oynayacağın karakter</legend>
                            <label class="character-option"><input type="radio" name="character" value="boy" required><span class="character-card"><span class="character-portrait"><img src="assets/images/child-0.svg" alt="Sırt çantalı erkek çocuk" width="96" height="120"></span><strong>Erkek çocuk</strong><span class="character-check" aria-hidden="true">✓</span></span></label>
                            <label class="character-option"><input type="radio" name="character" value="girl" required><span class="character-card"><span class="character-portrait"><img src="assets/images/girl-0.svg" alt="Başörtülü, sırt çantalı kız çocuk" width="96" height="120"></span><strong>Kız çocuk</strong><span class="character-check" aria-hidden="true">✓</span></span></label>
                        </fieldset>
                        <button id="start-button" type="submit" disabled>Maceraya başla →</button>
                        <p class="character-note">3 elmayı bul, anahtarı al ve cami girişine ulaş.</p>
                    </form>
                </section>
                <section id="game-result" class="result" aria-labelledby="result-title" hidden>
                    <div class="result-card"><p class="eyebrow">İLK KEŞİF TAMAMLANDI</p><h2 id="result-title">Harika bir keşifti!</h2><p>Üç elmayı saydın, anahtarı buldun<br>ve cami girişine ulaştın.</p><p id="result-score" class="result-score"></p><button id="play-again" type="button">Bir kez daha keşfet →</button><p class="result-note">Yeni bölgeler bir sonraki maceramız.</p></div>
                </section>
            </div>
            <div id="touch-controls" class="touch-controls" aria-label="Hareket düğmeleri" hidden>
                <div class="direction-buttons"><button id="move-left" class="touch-button" type="button" aria-label="Sola yürü">◀</button><button id="move-right" class="touch-button" type="button" aria-label="Sağa yürü">▶</button></div>
                <button id="jump" class="touch-button jump-button" type="button" aria-label="Zıpla">↑ <span>Zıpla</span></button>
            </div>
        </section>

        <p id="game-status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
</body>
</html>
